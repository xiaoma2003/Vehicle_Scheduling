<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超参数配置 - 车辆调度AI算法评测系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>车辆调度AI算法评测系统</h1>
            <nav>
                <a href="/">首页</a>
                <a href="/config/map">地图配置</a>
                <a href="/config/tasks">任务配置</a>
                <a href="/config/locomotives">机车配置</a>
                <a href="/config/hyper">超参数</a>
                <a href="/scheduling">调度控制</a>
                <a href="/comparison">策略对比</a>
                <a href="/query">数据查询</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>超参数配置</h2>
                <div id="hyper_table">加载中...</div>
            </section>
        </main>

        <footer>
            <p>车辆调度AI算法评测系统 v1.0</p>
        </footer>
    </div>

    <script>
        async function loadHyperParams() {
            const response = await fetch('/api/configs/hyper');
            const data = await response.json();
            renderHyperParams(data);
        }

        function renderHyperParams(params) {
            const container = document.getElementById('hyper_table');
            let html = '<table><tr><th>参数名</th><th>值</th></tr>';
            for (const [key, value] of Object.entries(params)) {
                if (typeof value === 'object') {
                    html += `<tr><td>${key}</td><td>${JSON.stringify(value)}</td></tr>`;
                } else {
                    html += `<tr><td>${key}</td><td>${value}</td></tr>`;
                }
            }
            html += '</table>';
            container.innerHTML = html;
        }

        loadHyperParams();
    </script>
</body>
</html>
