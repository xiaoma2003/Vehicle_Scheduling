<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务配置 - 车辆调度AI算法评测系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>车辆调度AI算法评测系统</h1>
            <nav>
                <a href="/">首页</a>
                <a href="/config/map">地图配置</a>
                <a href="/config/tasks">任务配置</a>
                <a href="/config/locomotives">机车配置</a>
                <a href="/config/hyper">超参数</a>
                <a href="/scheduling">调度控制</a>
                <a href="/comparison">策略对比</a>
                <a href="/query">数据查询</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>任务配置</h2>
                <button onclick="addTask()">添加任务</button>
                <div id="tasks_table">加载中...</div>
            </section>
        </main>

        <footer>
            <p>车辆调度AI算法评测系统 v1.0</p>
        </footer>
    </div>

    <script>
        async function loadTasks() {
            const response = await fetch('/api/configs/tasks');
            const data = await response.json();
            renderTasks(data.tasks);
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasks_table');
            let html = '<table><tr><th>任务ID</th><th>起点</th><th>终点</th><th>载重(吨)</th><th>优先级</th><th>类型</th><th>状态</th><th>物料标签</th><th>依赖</th></tr>';
            tasks.forEach(task => {
                html += `<tr>
                    <td>${task.task_id}</td>
                    <td>${task.start_node}</td>
                    <td>${task.end_node}</td>
                    <td>${task.load_weight}</td>
                    <td>${task.priority}</td>
                    <td>${task.task_type}</td>
                    <td>${task.status}</td>
                    <td>${task.material_tag}</td>
                    <td>${task.depends_on.join(', ') || '-'}</td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        function addTask() {
            alert('添加任务功能开发中');
        }

        loadTasks();
    </script>
</body>
</html>
