<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图配置 - 车辆调度AI算法评测系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>车辆调度AI算法评测系统</h1>
            <nav>
                <a href="/">首页</a>
                <a href="/config/map">地图配置</a>
                <a href="/config/tasks">任务配置</a>
                <a href="/config/locomotives">机车配置</a>
                <a href="/config/hyper">超参数</a>
                <a href="/scheduling">调度控制</a>
                <a href="/comparison">策略对比</a>
                <a href="/query">数据查询</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>地图配置</h2>
                <div class="config-form">
                    <div class="form-group">
                        <label>地图ID</label>
                        <input type="text" id="map_id" value="factory_map_001">
                    </div>
                    <div class="form-group">
                        <label>地图名称</label>
                        <input type="text" id="map_name" value="工厂区域地图">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="description">示例工厂区域地图，包含车站、能源补给站、物料站和道岔</textarea>
                    </div>
                    <button onclick="saveMapConfig()">保存配置</button>
                </div>

                <h3>节点列表</h3>
                <div id="nodes_list">加载中...</div>

                <h3>路段列表</h3>
                <div id="edges_list">加载中...</div>
            </section>
        </main>

        <footer>
            <p>车辆调度AI算法评测系统 v1.0</p>
        </footer>
    </div>

    <script>
        async function loadMapConfig() {
            const response = await fetch('/api/configs/map');
            const data = await response.json();
            document.getElementById('map_id').value = data.map_id;
            document.getElementById('map_name').value = data.map_name;
            document.getElementById('description').value = data.description;

            renderNodes(data.nodes);
            renderEdges(data.edges);
        }

        function renderNodes(nodes) {
            const container = document.getElementById('nodes_list');
            let html = '<table><tr><th>ID</th><th>名称</th><th>类型</th><th>位置</th></tr>';
            nodes.forEach(node => {
                html += `<tr>
                    <td>${node.node_id}</td>
                    <td>${node.node_name}</td>
                    <td>${node.node_type}</td>
                    <td>(${node.x}, ${node.y})</td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        function renderEdges(edges) {
            const container = document.getElementById('edges_list');
            let html = '<table><tr><th>起点</th><th>终点</th><th>距离(m)</th><th>限速(m/min)</th><th>坡度</th></tr>';
            edges.forEach(edge => {
                html += `<tr>
                    <td>${edge.from_node}</td>
                    <td>${edge.to_node}</td>
                    <td>${edge.distance}</td>
                    <td>${edge.speed_limit}</td>
                    <td>${edge.gradient}</td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        async function saveMapConfig() {
            const config = {
                map_id: document.getElementById('map_id').value,
                map_name: document.getElementById('map_name').value,
                description: document.getElementById('description').value
            };

            const response = await fetch('/api/configs', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({config_type: 'map', config_data: config})
            });
            const result = await response.json();
            alert(result.message);
        }

        loadMapConfig();
    </script>
</body>
</html>
