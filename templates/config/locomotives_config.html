<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机车配置 - 车辆调度AI算法评测系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>车辆调度AI算法评测系统</h1>
            <nav>
                <a href="/">首页</a>
                <a href="/config/map">地图配置</a>
                <a href="/config/tasks">任务配置</a>
                <a href="/config/locomotives">机车配置</a>
                <a href="/config/hyper">超参数</a>
                <a href="/scheduling">调度控制</a>
                <a href="/comparison">策略对比</a>
                <a href="/query">数据查询</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>机车配置</h2>
                <div id="locomotives_table">加载中...</div>
            </section>
        </main>

        <footer>
            <p>车辆调度AI算法评测系统 v1.0</p>
        </footer>
    </div>

    <script>
        async function loadLocomotives() {
            const response = await fetch('/api/configs/locomotives');
            const data = await response.json();
            renderLocomotives(data.locomotives);
        }

        function renderLocomotives(locomotives) {
            const container = document.getElementById('locomotives_table');
            let html = '<table><tr><th>机车ID</th><th>类型</th><th>载重(吨)</th><th>最大速度</th><th>初始位置</th><th>开机</th><th>可调度</th><th>能源</th><th>当前任务</th></tr>';
            locomotives.forEach(loco => {
                const energy = loco.traction_type === 'electric' ? `${loco.battery} kWh` : `${loco.fuel_tank} L`;
                html += `<tr>
                    <td>${loco.loco_id}</td>
                    <td>${loco.traction_type}</td>
                    <td>${loco.Q}</td>
                    <td>${loco.max_speed}</td>
                    <td>${loco.initial_node}</td>
                    <td>${loco.is_powered_on ? '是' : '否'}</td>
                    <td>${loco.is_schedulable ? '是' : '否'}</td>
                    <td>${energy}</td>
                    <td>${loco.current_task || '-'}</td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        loadLocomotives();
    </script>
</body>
</html>
