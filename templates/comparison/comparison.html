<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略对比 - 车辆调度AI算法评测系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>车辆调度AI算法评测系统</h1>
            <nav>
                <a href="/">首页</a>
                <a href="/config/map">地图配置</a>
                <a href="/config/tasks">任务配置</a>
                <a href="/config/locomotives">机车配置</a>
                <a href="/config/hyper">超参数</a>
                <a href="/scheduling">调度控制</a>
                <a href="/comparison">策略对比</a>
                <a href="/query">数据查询</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>策略对比</h2>
                <div id="comparison_table">加载中...</div>
            </section>
        </main>

        <footer>
            <p>车辆调度AI算法评测系统 v1.0</p>
        </footer>
    </div>

    <script>
        async function loadComparison() {
            const response = await fetch('/api/query/comparison');
            const data = await response.json();
            renderComparison(data.data);
        }

        function renderComparison(reports) {
            const container = document.getElementById('comparison_table');
            if (reports.length === 0) {
                container.innerHTML = '<p>暂无对比报告</p>';
                return;
            }

            let html = '<table><tr><th>批次ID</th><th>策略列表</th><th>最优策略</th><th>创建时间</th></tr>';
            reports.forEach(report => {
                html += `<tr>
                    <td>${report.batch_id}</td>
                    <td>${report.strategies.join(', ')}</td>
                    <td>${report.best_strategy || '-'}</td>
                    <td>${report.created_at || '-'}</td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        loadComparison();
    </script>
</body>
</html>
